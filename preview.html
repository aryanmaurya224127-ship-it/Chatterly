<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatterly — UI Preview</title>
  <link rel="stylesheet" href="./frontend/src/index.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="nav-rail">
      <div class="rail-brand"><span class="rail-brand-icon">●</span></div>
      <nav class="rail-nav">
        <button class="rail-item selected"><span class="rail-icon">▣</span><span>Chats</span></button>
        <button class="rail-item"><span class="rail-icon">♟</span><span>Groups</span></button>
      </nav>
      <div class="rail-bottom">
        <div class="rail-promo"><strong>Stay Connected<br />Always!</strong><span>🚀</span><i></i></div>
        <button class="rail-user"><span class="rail-user-avatar">A</span><span class="rail-user-copy"><strong>Aryan Maurya</strong><small><i></i> Online</small></span><span class="rail-chevron">⌄</span></button>
      </div>
    </aside>
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-heading"><span>MESSAGES</span><button class="compose-btn">＋</button></div>
        <div class="search-box"><span>⌕</span><input placeholder="Search chats..." /></div>
      </div>
      <div class="chat-list">
        <button class="chat-item active"><span class="avatar">P</span><span class="chat-item-copy"><strong>Priyanshu Mishra</strong><small>Hey bro! 👋</small></span><span class="chat-item-side"><i class="online-dot"></i></span></button>
        <button class="chat-item"><span class="avatar">♟</span><span class="chat-item-copy"><strong>Tech Gang</strong><small>Vinay: Project ready? 🚀</small></span></button>
        <button class="chat-item"><span class="avatar">R</span><span class="chat-item-copy"><strong>Raj Gupta</strong><small>Okay bhai 👍</small></span></button>
        <button class="chat-item"><span class="avatar">♟</span><span class="chat-item-copy"><strong>Study Group</strong><small>Kal ka plan kya hai?</small></span></button>
        <button class="chat-item"><span class="avatar">N</span><span class="chat-item-copy"><strong>Neha Sharma</strong><small>Thanks! 😊</small></span></button>
        <button class="chat-item"><span class="avatar">D</span><span class="chat-item-copy"><strong>Dev Team</strong><small>Good work everyone ✨</small></span></button>
      </div>
    </aside>
    <main class="chat-area">
      <header class="chat-header"><div class="chat-person"><span class="avatar large-avatar">P</span><div><h2>Priyanshu Mishra</h2><small>● Online</small></div></div><div class="header-actions"><span class="secure-label">✦ Private space</span></div></header>
      <section class="messages">
        <div class="welcome-panel"><div class="welcome-bubbles"><div class="welcome-bubble blue">•••</div><div class="welcome-bubble purple">•••</div></div><h1>Welcome to <em>Chatterly!</em> 🚀</h1><p>Start a conversation with Priyanshu Mishra</p></div>
      </section>
      <form class="composer"><input placeholder="Type a message..." /><button class="send-btn" type="button">➤</button></form>
      <div class="composer-foot">Press Enter to send <span>Chatterly · made for meaningful conversations</span></div>
    </main>
  </div>
</body>
</html>
